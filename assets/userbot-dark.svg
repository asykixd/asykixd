<svg xmlns="http://www.w3.org/2000/svg" width="412" height="344" viewBox="0 0 412 344" role="img" aria-label="Classified Telegram userbot — in development, written in Python">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.6px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; letter-spacing: 1px; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8b949e; letter-spacing: 1px; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .tiny  { font: 500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.2px; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    .ln    { animation: blink 3.2s ease-in-out infinite; }
    .gl    { opacity: 0; animation: glitch 5s steps(1,end) infinite; }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes glitch { 0%,88% { opacity: 0; transform: none; }
                         89% { opacity: .85; transform: translate(-2px,0); }
                         90% { opacity: .6;  transform: translate(3px,1px); }
                         91% { opacity: .85; transform: translate(-1px,-1px); }
                         92%,100% { opacity: 0; transform: none; } }
    .mono  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
    .cmd   { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #58a6ff; }
    .meta  { font: 400 9px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .caret { animation: caret 10s infinite; }
    .cb    { animation: cblink 1s steps(1,end) infinite; }
    .t1    { animation: t1 10s infinite; }
    .c1    { animation: c1 10s infinite; }
    .t2    { animation: t2 10s infinite; }
    .c2    { animation: c2 10s infinite; }
    .b1a   { animation: b1a 10s infinite; }
    .b1b   { animation: b1b 10s infinite; }
    .b2a   { animation: b2a 10s infinite; }
    .b2b   { animation: b2b 10s infinite; }
    @keyframes cblink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes caret {
      0%,4%     { transform: translateX(0); animation-timing-function: steps(5,end); }
      16%,19%   { transform: translateX(36px); }
      19.1%,42% { transform: translateX(0); animation-timing-function: steps(5,end); }
      54%,57%   { transform: translateX(36px); }
      57.1%,100% { transform: translateX(0); } }
    @keyframes t1 { 0%,19% { opacity: 1; } 19.1%,100% { opacity: 0; } }
    @keyframes c1 { 0%,4% { transform: translateX(0); animation-timing-function: steps(5,end); } 16%,100% { transform: translateX(36px); } }
    @keyframes t2 { 0%,39.9% { opacity: 0; } 40%,57% { opacity: 1; } 57.1%,100% { opacity: 0; } }
    @keyframes c2 { 0%,42% { transform: translateX(0); animation-timing-function: steps(5,end); } 54%,100% { transform: translateX(36px); } }
    @keyframes b1a { 0%,19% { opacity: 0; transform: translateY(6px); } 22%,29% { opacity: 1; transform: none; } 31%,100% { opacity: 0; transform: none; } }
    @keyframes b1b { 0%,29% { opacity: 0; } 31%,91% { opacity: 1; } 95%,100% { opacity: 0; } }
    @keyframes b2a { 0%,57% { opacity: 0; transform: translateY(6px); } 60%,67% { opacity: 1; transform: none; } 69%,100% { opacity: 0; transform: none; } }
    @keyframes b2b { 0%,67% { opacity: 0; } 69%,91% { opacity: 1; } 95%,100% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#161b22"/>
      <circle cx="6" cy="6" r=".9" fill="#21262d"/>
    </pattern>
    <clipPath id="panel"><rect x="24" y="52" width="364" height="132" rx="10"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="411" height="343" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="35" cy="32" r="3.5" fill="#d29922" class="live"/>
  <text x="46" y="36" class="label">IN DEVELOPMENT</text>
  <rect x="308" y="27" width="9" height="7" rx="1.5" fill="none" stroke="#6e7681" stroke-width="1.3"/><path d="M310 27 v-2.2 a2.5 2.5 0 0 1 5 0 V27" fill="none" stroke="#6e7681" stroke-width="1.3"/>
  <text x="380" y="36" class="label" text-anchor="end">PRIVATE</text>
  <rect x="24" y="52" width="364" height="132" rx="10" fill="url(#dots)" stroke="#21262d"/>
  <text x="32" y="226" class="title">???????</text>
  <text x="32" y="226" class="title gl" fill="#f85149" style="fill:#f85149">???????</text>
  <text x="222" y="226" class="link">github.com/asykixd/???</text>
  <text x="32" y="254" class="desc ln" style="animation-delay:0.0s">??????? ???????? ??? ????????, ??????? ?</text><text x="32" y="274" class="desc ln" style="animation-delay:0.6s">??????? ?? ???? ??????? ?? ????????????.</text>
  <rect x="32" y="296" width="80" height="24" rx="12" fill="none" stroke="#30363d"/><circle cx="46" cy="308" r="4" fill="#3572a5"/><text x="56" y="312" class="pill">Python</text><rect x="120" y="296" width="46" height="24" rx="12" fill="none" stroke="#30363d" stroke-dasharray="3 3"/><text x="143" y="312" class="pill" text-anchor="middle">???</text>
  <g clip-path="url(#panel)">
    <text x="40" y="76" class="tiny">SAVED MESSAGES</text>
    <circle cx="368" cy="72" r="3" fill="#3fb950" class="live"/>
    <text x="360" y="76" class="tiny" text-anchor="end">ONLINE</text>
    <g class="b1a"><rect x="314.0" y="88" width="58.0" height="22" rx="11" fill="#388bfd" fill-opacity=".16" stroke="#388bfd" stroke-opacity=".35"/><text x="325.0" y="103" class="cmd" textLength="36.0" lengthAdjust="spacingAndGlyphs">.ping</text></g>
    <g class="b1b"><rect x="214.4" y="88" width="157.6" height="22" rx="11" fill="#388bfd" fill-opacity=".16" stroke="#388bfd" stroke-opacity=".35"/><text x="225.4" y="103" class="mono" textLength="93.6" lengthAdjust="spacingAndGlyphs">ping: 12.4 ms</text><text x="362" y="103" class="meta" text-anchor="end">edited</text></g>
    <g class="b2a"><rect x="314.0" y="116" width="58.0" height="22" rx="11" fill="#388bfd" fill-opacity=".16" stroke="#388bfd" stroke-opacity=".35"/><text x="325.0" y="131" class="cmd" textLength="36.0" lengthAdjust="spacingAndGlyphs">.help</text></g>
    <g class="b2b"><rect x="185.6" y="116" width="186.4" height="22" rx="11" fill="#388bfd" fill-opacity=".16" stroke="#388bfd" stroke-opacity=".35"/><text x="196.6" y="131" class="mono" textLength="122.4" lengthAdjust="spacingAndGlyphs">?? modules loaded</text><text x="362" y="131" class="meta" text-anchor="end">edited</text></g>
    <rect x="36" y="146" width="340" height="26" rx="13" fill="#0d1117" stroke="#30363d"/>
    <g class="t1"><text x="50" y="163" class="cmd" textLength="36.0" lengthAdjust="spacingAndGlyphs">.ping</text><rect x="49" y="151" width="48" height="16" fill="#0d1117" class="c1"/></g>
    <g class="t2"><text x="50" y="163" class="cmd" textLength="36.0" lengthAdjust="spacingAndGlyphs">.help</text><rect x="49" y="151" width="48" height="16" fill="#0d1117" class="c2"/></g>
    <g class="caret"><rect x="50" y="152" width="1.5" height="14" fill="#58a6ff" class="cb"/></g>
    <circle cx="362" cy="159" r="9" fill="#58a6ff"/>
    <path d="M358 155 L367 159 L358 163 L359.5 159 Z" fill="#0d1117"/>
  </g>
</svg>
