<svg xmlns="http://www.w3.org/2000/svg" width="412" height="312" viewBox="0 0 412 312" role="img" aria-label="Unannounced VPN client in Rust — private, in development">
  <style>
    text  { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg   { font-size: 12px; fill: #1f2328; }
    .mu   { font-size: 12px; fill: #57606a; }
    .dim  { font-size: 12px; fill: #8a9099; }
    .acc  { font-size: 12px; fill: #1a7f37; font-weight: 600; }
    .warn { font-size: 12px; fill: #9a6700; font-weight: 600; }
    .sm   { font-size: 11px; }
    .hd   { font-size: 11px; font-weight: 600; letter-spacing: .6px; }
    .on   { opacity: 0; animation: on .01s steps(1,end) forwards; }
    .blink { animation: blink 1.1s steps(1,end) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes on    { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .prog { transform-box: fill-box; transform-origin: left; animation: prog 6s steps(24,end) infinite; }
    @keyframes prog { 0% { transform: scaleX(.05); } 85%,100% { transform: scaleX(1); } }
  </style>
  <rect width="412" height="312" rx="8" fill="#fbfbf8"/>
  <rect x="12.5" y="16.5" width="387.0" height="283.0" fill="none" stroke="#c9cdc4"/>
  <rect x="24.5" y="8.5" width="113.8" height="16" fill="#fbfbf8"/><text x="31.5" y="20.5" class="warn hd">03 · classified</text><rect x="326.9" y="8.5" width="60.6" height="16" fill="#fbfbf8"/><text x="333.9" y="20.5" class="dim hd">private</text>
  
  <g class="on" style="animation-delay:0.00s"><text x="30" y="50" class="acc">$</text><text x="44.4" y="50" class="fg">cargo build --release</text></g>
  <g class="on" style="animation-delay:.3s"><text x="44" y="74" class="acc">Compiling</text><rect x="125" y="64" width="72" height="13" fill="#8a9099" fill-opacity=".7"/><text x="205" y="74" class="dim">v0.1.0</text></g>
  <g class="on" style="animation-delay:.5s"><text x="44" y="93" class="acc">Compiling</text><rect x="125" y="83" width="104" height="13" fill="#8a9099" fill-opacity=".7"/><text x="237" y="93" class="dim">v0.1.0</text></g>
  <g class="on" style="animation-delay:.7s"><text x="44" y="112" class="acc">Building</text><text x="125" y="112" class="dim">[</text><rect x="135" y="103" width="190" height="10" fill="#9a6700" class="prog"/><text x="330" y="112" class="dim">]</text></g>
  <g class="on" style="animation-delay:0.90s"><text x="30" y="150" class="acc">status</text><text x="106" y="150" class="fg"><tspan fill="#9a6700">in development</tspan></text></g><g class="on" style="animation-delay:0.96s"><text x="30" y="169" class="acc">kind</text><text x="106" y="169" class="fg">native vpn client</text></g><g class="on" style="animation-delay:1.02s"><text x="30" y="188" class="acc">lang</text><text x="106" y="188" class="fg">rust</text></g><g class="on" style="animation-delay:1.08s"><text x="30" y="207" class="acc">release</text><text x="106" y="207" class="fg">tba</text></g>
  <g class="on" style="animation-delay:1.2s"><text x="30" y="238" class="dim"># codename and details</text><text x="30" y="256" class="dim"># classified until release</text></g>
  <g class="on" style="animation-delay:1.40s"><text x="30" y="286" class="acc">$</text><text x="44.4" y="286" class="fg"></text><rect x="44.4" y="275" width="7.2" height="14" fill="#1a7f37" class="blink"/></g>
</svg>
