  <rect x=".5" y=".5" width="839" height="231" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x=".5" y=".5" width="839" height="231" rx="12" fill="url(#glow)"/>
  <g class="rise" style="animation-delay:.1s"><circle cx="35" cy="36" r="3.5" fill="#2dd4bf" class="live"/><text x="46" y="40" class="label">SOFTWARE ENGINEER</text></g>
