    .l3 { animation: l3 12.0s infinite; } @keyframes l3 { 0%,22.5% { opacity: 0; } 22.6%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
    .l4 { animation: l4 12.0s infinite; } @keyframes l4 { 0%,29.2% { opacity: 0; } 29.3%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
    .l5 { animation: l5 12.0s infinite; } @keyframes l5 { 0%,35.8% { opacity: 0; } 35.9%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
    .l6 { animation: l6 12.0s infinite; } @keyframes l6 { 0%,42.5% { opacity: 0; } 42.6%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
  </style>
