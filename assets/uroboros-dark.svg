<svg xmlns="http://www.w3.org/2000/svg" width="840" height="258" viewBox="0 0 840 258" role="img" aria-label="Uroboros v1.0.1 — modular Telegram userbot on Python and Telethon. PyPI, Docker. AGPL-3.0.">
  <style>
    text  { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg   { font-size: 12px; fill: #d6dde6; }
    .mu   { font-size: 12px; fill: #9aa5b1; }
    .dim  { font-size: 12px; fill: #5d6773; }
