<svg xmlns="http://www.w3.org/2000/svg" width="840" height="292" viewBox="0 0 840 292" role="img" aria-label="Uroboros v1.0.0 — modular Telegram userbot on Python and Telethon. PyPI, Docker. AGPL-3.0.">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.6px; }
    .tiny  { font: 500 9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.2px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8b949e; }
    .val   { font: 500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .mono  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
    .acc   { font: 500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #2dd4bf; }
    .rise  { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .m1 { animation: m1 10s infinite; } .m2 { animation: m2 10s infinite; }
    .m3 { animation: m3 10s infinite; } .m4 { animation: m4 10s infinite; }
    @keyframes m1 { 0%,2% { opacity: 0; transform: translateY(6px); } 5%,92% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
    @keyframes m2 { 0%,12% { opacity: 0; transform: translateY(6px); } 16%,92% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
    @keyframes m3 { 0%,42% { opacity: 0; transform: translateY(6px); } 45%,92% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
    @keyframes m4 { 0%,52% { opacity: 0; transform: translateY(6px); } 56%,92% { opacity: 1; transform: none; } 96%,100% { opacity: 0; } }
  </style>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".10"/><stop offset=".7" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#161b22"/><circle cx="6" cy="6" r=".9" fill="#21262d"/></pattern></defs>
  <rect x=".5" y=".5" width="839" height="291" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x=".5" y=".5" width="839" height="291" rx="12" fill="url(#glow)"/>
  <circle cx="35" cy="34" r="3.5" fill="#2dd4bf" class="live"/><text x="46" y="38" class="label">02 · TELEGRAM USERBOT</text>
  <text x="32" y="78" class="title">Uroboros</text><rect x="152.8" y="60" width="61.2" height="22" rx="11" fill="#0f3d38"/><text x="161.8" y="75" class="acc">v1.0.0</text>
  <text x="32" y="100" class="link">github.com/asykixd/uroboros</text>
  <text x="32" y="132" class="desc">Modular Telegram userbot. One-command modules, inline</text><text x="32" y="152" class="desc">forms, code scanning before install, access levels, update</text><text x="32" y="172" class="desc">channels with rollback, scheduled backups.</text>
  <text x="32" y="210" class="tiny">RUNTIME</text><text x="32" y="229" class="val">Python 3.10+</text><line x1="136.8" y1="200" x2="136.8" y2="232" stroke="#21262d"/><text x="150.8" y="210" class="tiny">LICENSE</text><text x="150.8" y="229" class="val">AGPL-3.0</text><line x1="226.0" y1="200" x2="226.0" y2="232" stroke="#21262d"/><text x="240.0" y="210" class="tiny">INSTALL</text><text x="240.0" y="229" class="val">PyPI · Docker</text><line x1="352.2" y1="200" x2="352.2" y2="232" stroke="#21262d"/><text x="366.2" y="210" class="tiny">COMPAT</text><text x="366.2" y="229" class="val">Hikka · FTG</text>
  <rect x="32.0" y="244" width="63.7" height="24" rx="12" fill="none" stroke="#30363d"/><text x="63.9" y="260" class="pill" text-anchor="middle">Python</text><rect x="103.7" y="244" width="77.6" height="24" rx="12" fill="none" stroke="#30363d"/><text x="142.5" y="260" class="pill" text-anchor="middle">Telethon</text><rect x="189.3" y="244" width="70.7" height="24" rx="12" fill="none" stroke="#30363d"/><text x="224.6" y="260" class="pill" text-anchor="middle">aiogram</text>
  <rect x="500" y="24" width="308" height="244" rx="10" fill="url(#dots)" stroke="#21262d"/>
  <text x="516" y="46" class="tiny">SAVED MESSAGES</text><text x="792" y="46" class="tiny" text-anchor="end">TELEGRAM</text>
  <g class="m1"><rect x="696.0" y="60" width="96.0" height="26" rx="8" fill="#0f3d38"/><text x="780" y="77" class="acc" text-anchor="end">.dlm notes</text></g><g class="m2"><rect x="516" y="94" width="200" height="84" rx="8" fill="#0d1117" stroke="#21262d"/><text x="528" y="114" class="mono" style="font-weight:600">notes 1.0 installed</text><circle cx="531" cy="134" r="2.5" fill="#2dd4bf"/><text x="540" y="138" class="link" style="fill:#8b949e">code scan</text><text x="700" y="138" class="link" text-anchor="end" style="fill:#e6edf3">passed</text><circle cx="531" cy="152" r="2.5" fill="#2dd4bf"/><text x="540" y="156" class="link" style="fill:#8b949e">permissions</text><text x="700" y="156" class="link" text-anchor="end" style="fill:#e6edf3">none</text><circle cx="531" cy="170" r="2.5" fill="#2dd4bf"/><text x="540" y="174" class="link" style="fill:#8b949e">commands</text><text x="700" y="174" class="link" text-anchor="end" style="fill:#e6edf3">4</text></g><g class="m3"><rect x="717.6" y="182" width="74.4" height="26" rx="8" fill="#0f3d38"/><text x="780" y="199" class="acc" text-anchor="end">.update</text></g><g class="m4"><rect x="516" y="216" width="200" height="48" rx="8" fill="#0d1117" stroke="#21262d"/><text x="528" y="236" class="mono" style="font-weight:600">uroboros 1.0.0</text><circle cx="531" cy="256" r="2.5" fill="#2dd4bf"/><text x="540" y="260" class="link" style="fill:#8b949e">channel</text><text x="700" y="260" class="link" text-anchor="end" style="fill:#e6edf3">stable</text></g>
</svg>
