<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-label="Rust, Python, C, TypeScript">
  <style>
    .name { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; }
    .cap  { font: 400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #656d76; }
    .tools { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; letter-spacing: .2px; }
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; letter-spacing: 1.6px; }
    .cell { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .bar  { transform-box: fill-box; transform-origin: left; transform: scaleX(0);
             animation: grow 1.1s cubic-bezier(.65,0,.35,1) forwards; }
    .tail { opacity: 0; animation: fade .8s ease forwards 1.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="839" height="167" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="24" class="label">STACK</text>
  <g class="cell" style="animation-delay:0.25s">
    <circle cx="37.0" cy="47" r="5" fill="#dea584"/>
    <text x="50.0" y="52" class="name">Rust</text>
    <text x="32.0" y="78" class="cap">Systems, CLI, async services</text>
    <rect x="32.0" y="98" width="179.0" height="2" rx="1" fill="#eaeef2"/>
    <rect x="32.0" y="98" width="179.0" height="2" rx="1" fill="#dea584" class="bar" style="animation-delay:0.60s"/>
  </g>
  <g class="cell" style="animation-delay:0.39s">
    <circle cx="236.0" cy="47" r="5" fill="#3572a5"/>
    <text x="249.0" y="52" class="name">Python</text>
    <text x="231.0" y="78" class="cap">Automation and scripting</text>
    <rect x="231.0" y="98" width="179.0" height="2" rx="1" fill="#eaeef2"/>
    <rect x="231.0" y="98" width="179.0" height="2" rx="1" fill="#3572a5" class="bar" style="animation-delay:0.74s"/>
  </g>
  <g class="cell" style="animation-delay:0.53s">
    <circle cx="435.0" cy="47" r="5" fill="#a8b9cc"/>
    <text x="448.0" y="52" class="name">C</text>
    <text x="430.0" y="78" class="cap">Low-level and performance</text>
    <rect x="430.0" y="98" width="179.0" height="2" rx="1" fill="#eaeef2"/>
    <rect x="430.0" y="98" width="179.0" height="2" rx="1" fill="#a8b9cc" class="bar" style="animation-delay:0.88s"/>
  </g>
  <g class="cell" style="animation-delay:0.67s">
    <circle cx="634.0" cy="47" r="5" fill="#3178c6"/>
    <text x="647.0" y="52" class="name">TypeScript</text>
    <text x="629.0" y="78" class="cap">Desktop and web apps</text>
    <rect x="629.0" y="98" width="179.0" height="2" rx="1" fill="#eaeef2"/>
    <rect x="629.0" y="98" width="179.0" height="2" rx="1" fill="#3178c6" class="bar" style="animation-delay:1.02s"/>
  </g>
  <g class="tail">
    <line x1="32" y1="124" x2="808" y2="124" stroke="#eaeef2"/>
    <text x="32" y="148" class="tools">React · Electron · Node.js · Linux · Docker · Git</text>
  </g>
</svg>
