<svg xmlns="http://www.w3.org/2000/svg" width="840" height="208" viewBox="0 0 840 208" role="img" aria-label="Stack: Rust, Python, TypeScript, C; Electron, React, Node.js, Linux, Docker, ADB, scrcpy, Telethon, aiogram">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; letter-spacing: 1.6px; }
    .tiny  { font: 500 9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; letter-spacing: 1.2px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #656d76; }
    .val   { font: 500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #656d76; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; }
    .mono  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1f2328; }
    .acc   { font: 500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #0f766e; }
    .rise  { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0f766e" stop-opacity=".08"/><stop offset=".7" stop-color="#0f766e" stop-opacity="0"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f6f8fa"/><circle cx="6" cy="6" r=".9" fill="#d8dee4"/></pattern></defs>
  <rect x=".5" y=".5" width="839" height="207" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  
  <text x="32" y="36" class="label">STACK</text>
  <g class="rise" style="animation-delay:0.20s"><circle cx="37" cy="63" r="5" fill="#dea584"/><text x="50" y="68" style="font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328">Rust</text><text x="32" y="92" class="desc" style="font-size:12.5px">Systems and networking</text><text x="32" y="114" class="link"><tspan style="fill:#0f766e">→</tspan> vpn client</text><text x="32" y="164" class="tiny">DESKTOP</text><text x="32" y="184" class="link" style="fill:#656d76">Electron · React · Node.js</text></g>
  <g class="rise" style="animation-delay:0.32s"><circle cx="236" cy="63" r="5" fill="#3572a5"/><text x="249" y="68" style="font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328">Python</text><text x="231" y="92" class="desc" style="font-size:12.5px">Automation, bots, async I/O</text><text x="231" y="114" class="link"><tspan style="fill:#0f766e">→</tspan> uroboros</text><text x="231" y="164" class="tiny">INFRA</text><text x="231" y="184" class="link" style="fill:#656d76">Linux · Docker · Actions</text></g>
  <g class="rise" style="animation-delay:0.44s"><circle cx="435" cy="63" r="5" fill="#3178c6"/><text x="448" y="68" style="font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328">TypeScript</text><text x="430" y="92" class="desc" style="font-size:12.5px">Desktop and web apps</text><text x="430" y="114" class="link"><tspan style="fill:#0f766e">→</tspan> Evelin</text><text x="430" y="164" class="tiny">ANDROID</text><text x="430" y="184" class="link" style="fill:#656d76">ADB · scrcpy · WebCodecs</text></g>
  <g class="rise" style="animation-delay:0.56s"><circle cx="634" cy="63" r="5" fill="#a8b9cc"/><text x="647" y="68" style="font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328">C</text><text x="629" y="92" class="desc" style="font-size:12.5px">Low-level and performance</text><text x="629" y="114" class="link"><tspan style="fill:#0f766e">→</tspan> systems work</text><text x="629" y="164" class="tiny">TELEGRAM</text><text x="629" y="184" class="link" style="fill:#656d76">Telethon · aiogram</text></g>
  <line x1="32" y1="138" x2="808" y2="138" stroke="#eaeef2"/>
</svg>
