<svg xmlns="http://www.w3.org/2000/svg" width="412" height="344" viewBox="0 0 412 344" role="img" aria-label="Classified VPN project — in development, written in Rust">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.6px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; letter-spacing: 1px; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8b949e; letter-spacing: 1px; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .tiny  { font: 500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.2px; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    .ln    { animation: blink 3.2s ease-in-out infinite; }
    .gl    { opacity: 0; animation: glitch 5s steps(1,end) infinite; }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes glitch { 0%,88% { opacity: 0; transform: none; }
                         89% { opacity: .85; transform: translate(-2px,0); }
                         90% { opacity: .6;  transform: translate(3px,1px); }
                         91% { opacity: .85; transform: translate(-1px,-1px); }
                         92%,100% { opacity: 0; transform: none; } }
    .conn { animation: phA 6s ease-in-out infinite; }
    .on   { animation: phB 6s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .rip  { transform-box: fill-box; transform-origin: center; animation: rip 1.8s ease-out infinite; }
    .flow { animation: flow .9s linear infinite; }
    @keyframes phA  { 0%,48% { opacity: 1; } 53%,95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes phB  { 0%,48% { opacity: 0; } 53%,95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rip  { from { transform: scale(1); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#161b22"/>
      <circle cx="6" cy="6" r=".9" fill="#21262d"/>
    </pattern>
    <clipPath id="panel"><rect x="24" y="52" width="364" height="132" rx="10"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="411" height="343" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="35" cy="32" r="3.5" fill="#d29922" class="live"/>
  <text x="46" y="36" class="label">IN DEVELOPMENT</text>
  <rect x="308" y="27" width="9" height="7" rx="1.5" fill="none" stroke="#6e7681" stroke-width="1.3"/><path d="M310 27 v-2.2 a2.5 2.5 0 0 1 5 0 V27" fill="none" stroke="#6e7681" stroke-width="1.3"/>
  <text x="380" y="36" class="label" text-anchor="end">PRIVATE</text>
  <rect x="24" y="52" width="364" height="132" rx="10" fill="url(#dots)" stroke="#21262d"/>
  <text x="32" y="226" class="title">????-??????</text>
  <text x="32" y="226" class="title gl" fill="#f85149" style="fill:#f85149">????-??????</text>
  <text x="222" y="226" class="link">github.com/asykixd/???</text>
  <text x="32" y="254" class="desc ln" style="animation-delay:0.0s">????? ??? ??????? ????? ?? ??? ????????</text><text x="32" y="274" class="desc ln" style="animation-delay:0.6s">?????????, ???? ?? ??? ?????? ?????????.</text>
  <rect x="32" y="296" width="66" height="24" rx="12" fill="none" stroke="#30363d"/><circle cx="46" cy="308" r="4" fill="#dea584"/><text x="56" y="312" class="pill">Rust</text><rect x="106" y="296" width="46" height="24" rx="12" fill="none" stroke="#30363d" stroke-dasharray="3 3"/><text x="129" y="312" class="pill" text-anchor="middle">???</text>
  <g clip-path="url(#panel)">
    <line x1="40" y1="108" x2="372" y2="108" stroke="#21262d" stroke-width="1.5" stroke-dasharray="2 8"/>
    <g class="on">
      <line x1="40" y1="108" x2="372" y2="108" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round" class="flow"/>
      <circle cx="206" cy="108" r="28" fill="none" stroke="#3fb950" stroke-width="1.5" class="rip"/>
      <circle cx="206" cy="108" r="28" fill="none" stroke="#3fb950" stroke-width="1.5" class="rip" style="animation-delay:.9s"/>
    </g>
    <circle cx="206" cy="108" r="36" fill="none" stroke="#21262d" stroke-width="3"/>
    <g class="conn">
      <circle cx="206" cy="108" r="36" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="52 175" class="spin"/>
    </g>
    <g class="on">
      <circle cx="206" cy="108" r="36" fill="none" stroke="#3fb950" stroke-width="3"/>
    </g>
    <circle cx="206" cy="108" r="28" fill="#0d1117" stroke="#30363d"/>
    <g class="conn">
      <path d="M199.57 100.34 A10 10 0 1 0 212.43 100.34 M206 95 V105" fill="none" stroke="#6e7681" stroke-width="2.4" stroke-linecap="round"/>
      <text x="206" y="172" class="tiny ln" text-anchor="middle">CONNECTING…</text>
    </g>
    <g class="on">
      <circle cx="206" cy="108" r="28" fill="#3fb950" fill-opacity=".12" stroke="#3fb950"/>
      <path d="M199.57 100.34 A10 10 0 1 0 212.43 100.34 M206 95 V105" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round"/>
      <text x="206" y="172" class="tiny" text-anchor="middle" style="fill:#3fb950">CONNECTED</text>
    </g>
    <text x="40" y="76" class="tiny">TUNNEL</text>
    <text x="372" y="76" class="tiny" text-anchor="end">0-RTT</text>
    <text x="40" y="172" class="tiny">SRV ??-???</text>
    <text x="372" y="172" class="tiny" text-anchor="end">?? ms</text>
  </g>
</svg>
