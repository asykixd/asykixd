<svg xmlns="http://www.w3.org/2000/svg" width="412" height="344" viewBox="0 0 412 344" role="img" aria-label="Unannounced VPN client in Rust — private, in development">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.6px; }
    .tiny  { font: 500 9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.2px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8b949e; }
    .val   { font: 500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .mono  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
    .acc   { font: 500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #2dd4bf; }
    .rise  { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .flow { animation: flow .9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".10"/><stop offset=".7" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#161b22"/><circle cx="6" cy="6" r=".9" fill="#21262d"/></pattern></defs>
  <rect x=".5" y=".5" width="411" height="343" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x=".5" y=".5" width="411" height="343" rx="12" fill="url(#glow)"/>
  <circle cx="35" cy="32" r="3.5" fill="#d29922" class="live"/><text x="46" y="36" class="label">03 · IN DEVELOPMENT</text>
  <rect x="302" y="27" width="9" height="7" rx="1.5" fill="none" stroke="#6e7681" stroke-width="1.3"/><path d="M304 27 v-2.2 a2.5 2.5 0 0 1 5 0 V27" fill="none" stroke="#6e7681" stroke-width="1.3"/><text x="380" y="36" class="label" text-anchor="end">PRIVATE</text>
  <rect x="24" y="52" width="364" height="132" rx="10" fill="url(#dots)" stroke="#21262d"/>
  <rect x="48" y="96" width="56" height="44" rx="8" fill="#0d1117" stroke="#30363d"/><text x="76" y="122" class="tiny" text-anchor="middle">CLIENT</text><rect x="308" y="96" width="56" height="44" rx="8" fill="#0d1117" stroke="#30363d"/><text x="336" y="122" class="tiny" text-anchor="middle">EXIT</text>
  <rect x="104" y="108" width="204" height="20" rx="10" fill="none" stroke="#30363d"/><line x1="112" y1="118" x2="300" y2="118" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 14" stroke-linecap="round" class="flow"/>
  <text x="206" y="160" class="tiny" text-anchor="middle">ENCRYPTED TUNNEL</text>
  <rect x="32" y="205" width="150" height="22" rx="2" fill="#6e7681" fill-opacity=".55"/><text x="194" y="224" class="link">codename redacted</text>
  <text x="32" y="254" class="desc">Native VPN client. Details stay classified</text><text x="32" y="274" class="desc">until the first public release.</text>
  <text x="32" y="306" class="tiny">LANG</text><text x="32" y="325" class="val">Rust</text><line x1="78.0" y1="296" x2="78.0" y2="328" stroke="#21262d"/><text x="92.0" y="306" class="tiny">STATUS</text><text x="92.0" y="325" class="val">building</text><line x1="167.2" y1="296" x2="167.2" y2="328" stroke="#21262d"/><text x="181.2" y="306" class="tiny">RELEASE</text><text x="181.2" y="325" class="val">TBA</text>
</svg>
