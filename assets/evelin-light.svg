<svg xmlns="http://www.w3.org/2000/svg" width="840" height="232" viewBox="0 0 840 232" role="img" aria-label="Evelin — Android device fleet manager">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; letter-spacing: 1.6px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #656d76; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #656d76; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8c959f; }
    .ph  { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .ln  { animation: blink 3.2s ease-in-out infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0b8a63" stop-opacity=".07"/><stop offset=".7" stop-color="#0b8a63" stop-opacity="0"/></radialGradient></defs>
