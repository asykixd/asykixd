  <circle cx="35" cy="34" r="3.5" fill="#2dd4bf" class="live"/><text x="46" y="38" class="label">01 · DESKTOP APP</text>
  <text x="32" y="78" class="title">Evelin</text><rect x="125.6" y="60" width="61.2" height="22" rx="11" fill="#0f3d38"/><text x="134.6" y="75" class="acc">v1.1.1</text>
  <text x="32" y="100" class="link">github.com/asykixd/Evelin</text>
  <text x="32" y="132" class="desc">Control panel for Android device farms. Mirror and drive</text><text x="32" y="152" class="desc">dozens of USB phones from one window: live screens, input</text><text x="32" y="172" class="desc">broadcast, recorded scenarios, batch ADB and proxies.</text>
