<svg xmlns="http://www.w3.org/2000/svg" width="840" height="292" viewBox="0 0 840 292" role="img" aria-label="Evelin v1.1.1 — desktop control panel for Android device farms. Electron, React, TypeScript, ADB, scrcpy. MIT.">
  <style>
    .label { font: 600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.6px; }
    .tiny  { font: 500 9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; letter-spacing: 1.2px; }
    .title { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .desc  { font: 400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8b949e; }
    .val   { font: 500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
    .pill  { font: 500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
    .link  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #6e7681; }
    .mono  { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
    .acc   { font: 500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #2dd4bf; }
    .rise  { opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .rip { transform-box: fill-box; transform-origin: center; animation: rip 2.4s ease-out infinite; }
    .cur { animation: cur 2.4s ease-in-out infinite; }
    .ln  { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes rip { 0%,30% { transform: scale(.2); opacity: 0; } 34% { opacity: .9; } 80%,100% { transform: scale(1.6); opacity: 0; } }
    @keyframes cur { 0% { transform: translate(14px,16px); } 30%,100% { transform: none; } }
  </style>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".10"/><stop offset=".7" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#161b22"/><circle cx="6" cy="6" r=".9" fill="#21262d"/></pattern></defs>
